# Local Elasticsearch and Postgres (pgvector) used by the end-to-end tests (see DEVELOPMENT.md).
# CI uses equivalent `services:` containers in .github/workflows/test.yml.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # trial licence so the hybrid (rank.rrf) semantic tests can run; e2e cluster only
      - xpack.license.self_generated.type=trial
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      # override the host port with E2E_ES_PORT if 9200 is taken (then also set ES_HOST)
      - "${E2E_ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_PASSWORD=searchkit
    ports:
      # override the host port with E2E_PG_PORT if 5432 is taken (then also set DATABASE_URL)
      - "${E2E_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
