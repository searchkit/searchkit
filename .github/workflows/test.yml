name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # pnpm version comes from `packageManager` in package.json. Installed before setup-node so its pnpm cache works.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # typecheck depends on build in turbo.json, so the packages are built first.
      - name: Typecheck
        run: pnpm typecheck

      # @searchkit/core, @searchkit/adapter-elasticsearch and searchkit inline the @elastic/elasticsearch types
      # they use (a devDependency) into their published declarations. Fail if any package's dist/*.d.ts imports
      # a module that isn't one of its dependencies (scripts/check-dts.mjs). Runs after Typecheck, which builds
      # the packages.
      - name: Check published type declarations are self-contained
        run: pnpm --filter "./packages/*" run check:dts

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      # pnpm version comes from `packageManager` in package.json. Installed before setup-node so its pnpm cache works.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Drives the Next.js example in a real browser (Playwright) against a real Elasticsearch and a real
  # Postgres (pgvector), running as service containers. See DEVELOPMENT.md ("End-to-end tests").
  # Both are seeded, and the Playwright suite runs twice: project `chromium` (Elasticsearch) and project
  # `chromium-postgres` (the same example started with SEARCH_ADAPTER=postgres).
  functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ES_HOST: http://localhost:9200
      DATABASE_URL: postgres://postgres:searchkit@localhost:5432/postgres
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: searchkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # pnpm version comes from `packageManager` in package.json. Installed before setup-node so its pnpm cache works.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check the example uses the packages from this PR
        run: node e2e/check-workspace-links.mjs

      - name: Seed Elasticsearch
        run: node e2e/seed.mjs

      - name: Seed Postgres
        run: node e2e/seed-postgres.mjs

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e

      - name: Run functional tests (Elasticsearch and Postgres)
        run: pnpm test:e2e --project=chromium --project=chromium-postgres

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
