name: deploy docs
# Deploys only on a release: release.yml calls this after Changesets publishes to npm.
# Run it by hand (Actions -> deploy docs -> Run workflow) to redeploy without a release.
on:
  workflow_call:
  workflow_dispatch:

# Build in CI from the full monorepo checkout, then upload the prebuilt output.
# Uploading only apps/web (the old `vercel --prod` from that folder) breaks with pnpm:
# Vercel would get no pnpm-lock.yaml and none of the workspace packages apps/web links to.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_NEXT_PROJECT_ID }}
      VERCEL: npx --yes vercel@65.16.0
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json. Installed before setup-node so its pnpm cache works.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Pull Vercel project settings
        run: $VERCEL pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Runs the install and build commands from apps/web/vercel.json against the whole workspace.
      - name: Build
        run: $VERCEL build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # The build output's function file maps are relative to the repo root (pnpm keeps
      # dependencies in the root node_modules), so deploy from the root, not apps/web.
      - name: Move build output to the repo root
        run: mv .vercel ../../.vercel

      # The CLI reads the head commit from .git and sends its author to Vercel, which blocks the
      # deployment (TEAM_ACCESS_REQUIRED) when that author isn't on the Vercel team, e.g. any merged
      # outside contribution. The build is done, so drop .git and deploy without git metadata.
      - name: Deploy
        working-directory: .
        run: |
          rm -rf .git
          $VERCEL deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
