name: Release

# On every push to main, Changesets either opens/updates a "Version Packages" PR
# (when unreleased changesets exist) or, when that PR is merged, publishes to npm.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  issues: write # notify-released-issues.mjs comments on the issues a release fixes
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm version comes from `packageManager` in package.json. Installed before setup-node so its pnpm cache works.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          # No `registry-url` here: it writes an .npmrc with a NODE_AUTH_TOKEN placeholder token, and publishing
          # authenticates with npm trusted publishing (OIDC) instead (see "Create release PR or publish to npm").

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build and test
        run: |
          pnpm lint
          pnpm build
          pnpm test

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 no longer reads GITHUB_TOKEN from env; it passes this token on to the version/publish scripts
          # (as GITHUB_TOKEN, used by @changesets/changelog-github).
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # `changeset publish` publishes each package with `pnpm publish`. pnpm (>= 12) does the npm trusted
          # publishing OIDC token exchange itself (needs `id-token: write`), so no npm token or npm CLI upgrade is
          # needed. pnpm reads PNPM_CONFIG_* (not NPM_CONFIG_*) environment variables.
          PNPM_CONFIG_PROVENANCE: "true"

      - name: Comment on fixed issues with the released version
        if: steps.changesets.outputs.published == 'true'
        # Best effort: a failed comment must not fail the release job, or verify-published is skipped.
        continue-on-error: true
        run: node scripts/notify-released-issues.mjs '${{ steps.changesets.outputs.published-packages }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a publish: install the released packages from the npm registry (not the workspace) into a copy of the
  # Next.js example and run the Playwright functional tests against a real Elasticsearch.
  verify-published:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ES_HOST: http://localhost:9200
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json. Installed before setup-node so its pnpm cache works.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (for the Playwright runner)
        run: pnpm install --frozen-lockfile

      - name: Install the example from npm
        run: node scripts/prepare-published-example.mjs "$RUNNER_TEMP/published-example"

      - name: Seed Elasticsearch
        run: node e2e/seed.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run functional tests against the published packages
        run: pnpm test:e2e
        env:
          E2E_APP_DIR: ${{ runner.temp }}/published-example

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-published
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
