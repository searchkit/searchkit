name: Release

# On every push to main, Changesets either opens/updates a "Version Packages" PR
# (when unreleased changesets exist) or, when that PR is merged, publishes to npm.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Yarn 4 comes from corepack (`packageManager` in package.json); enable it before setup-node
      # so its yarn cache step runs the right yarn.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      # No npm upgrade needed: @changesets/cli 3 publishes Yarn Berry projects with `yarn npm info` /
      # `yarn npm publish`, and Yarn 4 does the npm trusted-publishing (OIDC) token exchange itself.

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint, build and test
        run: |
          yarn lint
          yarn build
          yarn test

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 no longer reads GITHUB_TOKEN from env; it passes this token on to the version/publish scripts
          # (as GITHUB_TOKEN, used by @changesets/changelog-github) along with CHANGESETS_OUTPUT.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Also refreshes yarn.lock: Yarn 4 records the examples' exact workspace versions in it, so a
          # version bump without this would break `yarn install --immutable` on main.
          version-script: yarn version-packages
          publish-script: yarn release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # `yarn npm publish` ignores NPM_CONFIG_PROVENANCE; this is Yarn's npmPublishProvenance setting.
          YARN_NPM_PUBLISH_PROVENANCE: "true"

      - name: Comment on fixed issues with the released version
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/notify-released-issues.mjs '${{ steps.changesets.outputs.published-packages }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a publish: install the released packages from the npm registry (not the workspace) into a copy of the
  # Next.js example and run the Playwright functional tests against a real Elasticsearch.
  verify-published:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ES_HOST: http://localhost:9200
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Yarn 4 comes from corepack (`packageManager` in package.json); enable it before setup-node
      # so its yarn cache step runs the right yarn.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies (for the Playwright runner)
        run: yarn install --immutable

      - name: Install the example from npm
        run: node scripts/prepare-published-example.mjs "$RUNNER_TEMP/published-example"

      - name: Seed Elasticsearch
        run: node e2e/seed.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run functional tests against the published packages
        run: yarn test:e2e
        env:
          E2E_APP_DIR: ${{ runner.temp }}/published-example

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-published
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
