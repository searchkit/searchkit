name: Release

# On every push to main, Changesets either opens/updates a "Version Packages" PR
# (when unreleased changesets exist) or, when that PR is merged, publishes to npm.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn

      - name: Lint, build and test
        run: |
          yarn lint
          yarn build
          yarn test

      - name: DEBUG npm info
        run: |
          npm -v
          cat "$NPM_CONFIG_USERCONFIG" | sed 's/_authToken=.*/_authToken=<redacted>/' || true
          yarn -s run env | grep -i npm_config_registry || true
          npm info @searchkit/api --registry https://registry.npmjs.org --json | head -c 300; echo "exit=$?"
          echo "--- via yarn run"
          yarn -s node -e "const r=require('child_process').spawnSync('npm',['info','@searchkit/api','--registry','https://registry.npmjs.org','--json']);console.log('status',r.status,'stdoutLen',r.stdout.length);console.log(String(r.stdout).slice(0,200));console.log('stderr',String(r.stderr).slice(0,500))"

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: yarn changeset version
          publish: yarn release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
